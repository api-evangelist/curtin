errors:
  generated: '2026-08-30'
  method: derived
  x-evidence-method: probed
  x-authorship: >-
    Generated by API Evangelist from live unauthenticated probes. Curtin University
    published none of this; the institution's own material is only the responses quoted.
  source:
    - https://www.curtin.edu.au/wp-json/mimas/v1/header
    - https://www.curtin.edu.au/wp-json/mcp/mcp-adapter-default-server
    - https://www.curtin.edu.au/wp-json/mimas/v1/search/elastic
    - https://api.coki.ac/institution/ZZZZZZZZZ
    - https://api.coki.ac/
    - https://aefbfwfqc4.execute-api.ap-southeast-2.amazonaws.com/prod/AMP/Catalogs
    - https://www.curtin.edu.au/.well-known/security.txt
  note: >-
    Curtin publishes no error reference for any of its surfaces. Every entry below is a response
    body observed live on 2026-08-30. Two of them are traps for a machine consumer and are
    recorded as such.
  surfaces:
    - name: Curtin Web Platform API (mimas/v1)
      x-operator: institution
      format: WordPress REST error envelope
      shape: '{ "code": string, "message": string, "data": { "status": integer } | null }'
      observed:
        - status: 403
          code: rest_forbidden
          message: 'Access denied: This endpoint can only be accessed from allowed domains.'
          path: /wp-json/mimas/v1/header
          data: null
        - status: 401
          code: rest_forbidden
          message: 'Sorry, you are not allowed to do that.'
          path: /wp-json/mcp/mcp-adapter-default-server
          data: { status: 401 }
      soft_failures:
        - path: /wp-json/mimas/v1/search/elastic
          status: 200
          body: '[]'
          description: >-
            A missing or misnamed search parameter is NOT an error. The endpoint returns HTTP 200
            with an empty JSON array instead of a 400. Probing with search=, s=, term= and
            keyword= all returned `[]`; only query= returns results. A consumer that trusts the
            status code will read a silent empty result as "no matches" rather than "wrong
            parameter name".
    - name: COKI Open Access Dashboard API
      x-operator: institution
      format: plain-text body, JSON content-type
      shape: 'Not found'
      observed:
        - status: 404
          body: Not found
          path: /institution/ZZZZZZZZZ
        - status: 404
          body: Not found
          path: /
          description: >-
            The API root is a 404. There is no index, no /docs and no /openapi.json, so a
            consumer has no discovery path — routes must be known in advance.
      note: >-
        Content-Type is application/json but the body is a bare unquoted string, which is not
        valid JSON. A strict JSON client will fail to parse the error rather than read it.
    - name: Curtin Data Platform (AMP)
      x-operator: institution
      format: AWS API Gateway default
      shape: '{ "message": string }'
      observed:
        - status: 401
          body: '{"message":"Unauthorized"}'
          path: /prod/AMP/Catalogs
    - name: www.curtin.edu.au (site-wide)
      x-operator: institution
      format: HTML
      observed:
        - status: 404
          content_type: text/html
          size_bytes: 227714
          paths:
            - /.well-known/security.txt
            - /.well-known/apis.json
            - /apis.json
            - /sitemap_index.xml
          description: >-
            Correct 404 status with a full HTML page body. Not a soft-404 — the status code is
            honest — but there is no machine-readable error representation anywhere on the site.
    - name: Curtin Curate research repository
      x-operator: tenant
      format: AWS WAF challenge
      observed:
        - status: 202
          content_type: text/html
          description: >-
            HTTP 202 Accepted carrying a JavaScript bot challenge, on every path including
            /oai and /esploro/oai/request?verb=Identify. A 2xx status on a body that contains no
            content. Any harvester reading status codes alone records this host as healthy while
            receiving nothing. awsWafCookieDomainList names figshare.com.
