conformance:
  generated: '2026-08-30'
  method: derived
  x-evidence-method: probed
  x-authorship: >-
    Generated by API Evangelist from live unauthenticated probes. Curtin University
    published none of this; the institution's own material is only the responses quoted.
  regime: education
  regime_source: Kin Score 0.12.0 education regulatory regime standards[]
  note: >-
    Reward-only. A standard is recorded as `confirmed` only where a live, unauthenticated fetch
    returned the artifact that proves it, and the `evidence` field names the exact location. Every
    other standard in the education regime is recorded as `not_confirmed` with what was actually
    probed, so a later run does not have to re-derive the negative. Curtin makes no written
    conformance claim about any of these; nothing here rests on a prose statement.
  confirmed:
    - standard: shibboleth
      x-operator: mixed
      summary: >-
        Curtin's identity federation speaks Shibboleth on both sides, but the two halves have
        different operators. The service provider at auth.lis.curtin.edu.au runs on Curtin's own
        Kubernetes cluster (institution). The Identity Provider at idpp1.curtin.edu.au CNAMEs to
        1f0b5d9aaec3f802f7411017de5ea657.idp-cname.aaf.edu.au, the Australian Access Federation's
        managed IdP service (tenant) — Curtin is the identity authority, AAF runs the software.
        Only the SP half is credited to Curtin as engineering.
      evidence:
        - url: https://idpp1.curtin.edu.au/idp/shibboleth
          status: 200
          content_type: application/xml;charset=utf-8
          x-operator: tenant
          detail: >-
            The IdP serves its own SAML 2.0 entity metadata unauthenticated. shibmd:Scope is
            `curtin.edu.au`. SSO endpoints at /idp/profile/SAML2/POST/SSO,
            /idp/profile/SAML2/Redirect/SSO and /idp/profile/SAML2/POST-SimpleSign/SSO.
            DNS: idpp1.curtin.edu.au CNAME 1f0b5d9aaec3f802f7411017de5ea657.idp-cname.aaf.edu.au
            — AAF managed IdP, so the deployment is AAF's, not Curtin's.
        - url: https://auth.lis.curtin.edu.au/Shibboleth.sso/Metadata
          status: 200
          content_type: application/samlmetadata+xml
          x-operator: institution
          detail: >-
            Curtin Library service provider metadata, served by a Shibboleth SP at a standard
            Shibboleth.sso path. DNS: auth.lis.curtin.edu.au CNAME elb.prod.library.curtin.edu.au
            -> k8s-traefik-traefikd-*.ap-southeast-2.elb.amazonaws.com, a Curtin-operated
            Kubernetes/Traefik load balancer. No vendor in the chain.
        - url: https://md.aaf.edu.au/aaf-metadata.xml
          status: 200
          detail: >-
            Australian Access Federation metadata aggregate (360 entities). Contains
            entityID https://idpp1.curtin.edu.au/idp/shibboleth with an IDPSSODescriptor and
            OrganizationDisplayName "Curtin University", and entityID
            https://auth.lis.curtin.edu.au/shibboleth with an SPSSODescriptor, same organisation.
    - standard: saml
      x-operator: mixed
      summary: SAML 2.0 is the protocol Curtin's federated identity actually speaks.
      evidence:
        - url: https://idpp1.curtin.edu.au/idp/shibboleth
          status: 200
          detail: >-
            protocolSupportEnumeration is urn:oasis:names:tc:SAML:2.0:protocol. Bindings declared:
            urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST,
            urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect and
            urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST-SimpleSign.
    - standard: datacite
      x-operator: institution
      summary: Curtin University is a DataCite member organisation minting DOIs under its own prefix allocation.
      evidence:
        - url: https://api.datacite.org/providers/curtin
          status: 200
          detail: >-
            DataCite provider id `curtin`, name "Curtin University", memberType
            consortium_organization, created 2024-02-08. A second legacy provider `curt`,
            "Curtin University of Technology", also exists.
        - url: https://api.datacite.org/clients?provider-id=curtin
          status: 200
          detail: >-
            Two repositories registered under the provider — `ardcx.curtin` "Curtin University
            Research Data Collection" and `curtin.repo2` "WA HeSANDA Node"
            (https://hesandawa.org, titled "WA HeSANDA | Curtin University").
        - url: https://api.datacite.org/dois?provider-id=curtin
          status: 200
          detail: 3,243 DOIs minted under the Curtin provider at time of probing.
    - standard: crossref
      x-operator: institution
      summary: Partial — one Curtin entity is a Crossref member, and it is the Malaysian campus, not the Perth university.
      evidence:
        - url: https://api.crossref.org/members?query=curtin
          status: 200
          detail: >-
            Exactly one member matches: id 49479, primary-name "Curtin (Malaysia) Sdn Bhd".
            Curtin University (Perth) is not itself a Crossref member. Recorded as a partial hit
            so the distinction survives; do not read it as the parent institution's membership.
  not_confirmed:
    - standard: oai-pmh
      probed:
        - url: https://espace.curtin.edu.au/oai/request?verb=Identify
          status: 301
          detail: >-
            Hard 301 to https://curate.curtin.edu.au/. The legacy espace OAI-PMH endpoint no
            longer exists; espace.curtin.edu.au is now only a redirector on Curtin's own AWS
            infrastructure (CNAME elb.prod.library.curtin.edu.au).
        - url: https://curate.curtin.edu.au/esploro/oai/request?verb=Identify
          status: 202
          detail: >-
            AWS WAF JavaScript challenge, zero-byte body. Same for /oai and /view/oai/request.
            No OAI-PMH Identify response could be obtained. The repository is a Figshare tenant;
            any OAI-PMH it exposes would be Figshare's implementation, not Curtin's.
    - standard: orcid
      probed:
        - url: https://pub.orcid.org/v3.0/expanded-search/?q=affiliation-org-name:%22Curtin%20University%22
          status: 200
          detail: >-
            7,565 ORCID records name Curtin University as an affiliation. That is ORCID's data
            about Curtin, not Curtin operating an ORCID integration, and it is not conformance.
            No Curtin-operated ORCID member surface was found.
    - standard: lti
      probed:
        - url: https://lms.curtin.edu.au
          status: not applicable
          detail: >-
            lms.curtin.edu.au is a CNAME to curtin.blackboard.com. Any LTI conformance belongs to
            Blackboard's product, not to Curtin's engineering. Not credited to the institution.
    - standard: caliper
      probed: []
      detail: No Caliper endpoint or claim found on any Curtin-operated host.
    - standard: scim
      probed: []
      detail: >-
        No SCIM endpoint found. Curtin's identity surface is SAML federation, not SCIM
        provisioning, as far as any public probe can see.
    - standard: oneroster
      probed: []
      detail: Not applicable in practice — OneRoster is a K-12 standard; no endpoint found.
    - standard: ed-fi
      probed: []
      detail: Not applicable in practice — Ed-Fi is a US K-12 standard; no endpoint found.
    - standard: qti
      probed: []
      detail: >-
        No QTI surface found. Assessment runs inside the Blackboard tenant, which is not
        Curtin-operated.
  other_identifiers:
    - standard: ror
      note: Not an education-regime standard, recorded because it is the identifier the COKI API keys on.
      evidence:
        - url: https://api.ror.org/v2/organizations/02n415q13
          status: 200
          detail: >-
            ROR https://ror.org/02n415q13, names "Curtin University" / "Curtin University of
            Technology", website https://www.curtin.edu.au.
