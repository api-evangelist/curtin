lifecycle:
  generated: '2026-08-30'
  method: derived
  x-evidence-method: probed
  x-authorship: >-
    Generated by API Evangelist from live unauthenticated probes. Curtin University
    published none of this; the institution's own material is only the responses quoted.
  source:
    - https://www.curtin.edu.au/wp-json/
    - https://api.coki.ac/institutions
    - https://www.curtin.edu.au/wp-json/mimas/v1/search/elastic?query=engineering
  note: >-
    Curtin publishes no changelog, no deprecation policy, no versioning statement and no status
    page for any surface. Everything below is inferred from what the live endpoints reveal about
    themselves, and is recorded as inference, not as a Curtin commitment.
  surfaces:
    - name: Curtin Web Platform API (mimas/v1)
      x-operator: institution
      versioning: path segment
      current: v1
      evidence: >-
        The namespace is registered as `mimas/v1` in Curtin's own WordPress REST discovery
        document. No v2 exists. WordPress core alongside it is at wp/v2.
      deprecation_policy: none published
      changelog: none published
      status_page: >-
        none. status.curtin.edu.au and systemstatus.curtin.edu.au do not resolve.
      observed_churn: >-
        The Elasticsearch index behind search/elastic is date-stamped —
        curtin-learning-offerings-prod-v20260830170034, rebuilt the morning of the probe. The
        index is versioned and rotated; the API path in front of it is not.
    - name: COKI Open Access Dashboard API
      x-operator: institution
      versioning: none
      current: unversioned
      evidence: >-
        Routes are bare (/institutions, /institution/{id}, /countries, /country/{id},
        /search/{text}). No version segment, no version header, no /v1. GET / returns 404
        "Not found", so there is no root document that could announce a version.
      deprecation_policy: none published
      changelog: none published
      breaking_change_risk: >-
        High for a consumer. An unversioned API with no discovery document, no OpenAPI and no
        changelog gives an integrator no signal before a shape change. The `stats` object alone
        carries 34 fields that a rename would silently break.
      caching: cache-control max-age=14400, s-maxage=604800 observed on responses
    - name: Curtin Data Platform (AMP)
      x-operator: institution
      versioning: stage segment
      current: /prod
      evidence: >-
        AWS API Gateway stage `prod` in the base path
        (https://aefbfwfqc4.execute-api.ap-southeast-2.amazonaws.com/prod/AMP/). Not a public API
        version — an AWS deployment stage. Endpoints are Cognito-gated (401 anonymous).
    - name: Curtin Curate research repository
      x-operator: tenant
      versioning: Figshare's
      note: >-
        espace.curtin.edu.au hard-301s to curate.curtin.edu.au. This is a platform migration
        Curtin performed with no public notice found and no redirect map beyond the site root —
        the previous Ex Libris repository's deep links and its OAI-PMH endpoint do not survive.
        Lifecycle of the platform is Figshare's; lifecycle of the migration is Curtin's, and it
        is undocumented.
