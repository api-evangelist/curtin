aid: curtin
name: Curtin University
x-type: university
x-category: Public Research University
description: >-
  Curtin University is a public research university in Perth, Western Australia, and the largest
  university in the state. Its programmable footprint is small, real, and almost entirely
  unadvertised: Curtin operates no developer portal, publishes no OpenAPI, and issues no API keys,
  yet three institution-operated surfaces answer unauthenticated requests today. The first is
  `mimas/v1`, the bespoke REST namespace registered by Curtin's own WordPress theme on
  www.curtin.edu.au, whose `search/elastic` endpoint is a keyless proxy onto Curtin's
  Elasticsearch cluster indexing `curtin-learning-offerings-prod-*` — the university's course and
  unit catalog. The second is the Curtin Open Knowledge Initiative's open-access analytics API at
  api.coki.ac, which serves CORS-open JSON for 60,562 institutions and every country with a
  26-year time series, and is the most substantial API Curtin engineers itself. The third is
  identity: Curtin Library runs a Shibboleth SAML 2.0 service provider on its own Kubernetes
  cluster, registered in the Australian Access Federation and therefore eduGAIN, serving its
  entity metadata publicly. Curtin's matching Identity Provider carries a curtin.edu.au hostname
  but CNAMEs into AAF's managed IdP service, so it is recorded as a tenant, a distinction only
  DNS resolution reveals. Beyond those, Curtin is a buyer rather than a producer. The research
  repository at curate.curtin.edu.au
  is a Figshare tenant — espace.curtin.edu.au, which this profile previously described as an Ex
  Libris Primo/Esploro repository, now hard-redirects there. Library discovery is an Ex Libris
  Primo/Alma tenant, the LMS is a Blackboard tenant, and the service desk is ServiceNow. Those
  relationships are recorded here as tenant surfaces because they are genuine institutional facts;
  the contracts behind them belong to the vendors and are deliberately not saved under Curtin's
  name.
type: Index
x-coverage:
  state: covered
  reason: covered
  detail: >-
    Three institution-operated surfaces were found live and keyless and are described from probed
    responses: the mimas/v1 WordPress namespace on www.curtin.edu.au (including an Elasticsearch
    course search), the COKI open-access API at api.coki.ac, and the Shibboleth SAML 2.0 service
    provider at auth.lis.curtin.edu.au, which resolves to Curtin's own Kubernetes cluster.
    Curtin's SAML Identity Provider at idpp1.curtin.edu.au is equally live and equally
    machine-readable but CNAMEs into AAF's managed IdP service, so it is recorded as a tenant
    rather than credited as Curtin engineering. A fourth institution-operated surface, the
    Curtin Data Platform behind
    data.curtin.edu.au, is real but Cognito-gated and returns 401 to anonymous callers, so it is
    recorded without a contract. Curtin publishes no developer portal, no OpenAPI, no llms.txt, no
    apis.json, no security.txt and no status page — none of those absences are inferred, each was
    probed. The research repository, library discovery and LMS are vendor platforms on Curtin
    subdomains and are recorded as tenants, not credited as Curtin engineering. Only
    curate.curtin.edu.au resisted probing: it answers every path with an HTTP 202 AWS WAF
    challenge and a zero-byte body, which is why no OAI-PMH Identify response could be obtained.
